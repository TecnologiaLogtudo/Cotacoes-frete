services:
  redis:
    image: redis:7-alpine
    container_name: logtudo-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: logtudo-app
    ipc: host
    security_opt:
      - seccomp=./seccomp-playwright.json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=cotacoes
      - RQ_JOB_TIMEOUT_SECONDS=7200
      - RQ_RESULT_TTL_SECONDS=86400
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.logtudo-cotacoes.rule=Host(`logtudo.com.br`) && PathPrefix(`/cotacoes`)
      - traefik.http.routers.logtudo-cotacoes.entrypoints=http,https
      - traefik.http.routers.logtudo-cotacoes.middlewares=logtudo-cotacoes-strip
      - traefik.http.middlewares.logtudo-cotacoes-strip.stripprefix.prefixes=/cotacoes
      - traefik.http.services.logtudo-cotacoes.loadbalancer.server.port=8000
      - coolify.managed=true
      - coolify.proxy=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "automacao.api:app", "--host", "0.0.0.0", "--port", "8000"]

  rq-worker:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: logtudo-rq-worker
    ipc: host
    security_opt:
      - seccomp=./seccomp-playwright.json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=cotacoes
      - RQ_JOB_TIMEOUT_SECONDS=7200
      - RQ_RESULT_TTL_SECONDS=86400
      - LOGTUDO_USER=${LOGTUDO_USER:-ATUALIZARBI}
      - LOGTUDO_PASS=${LOGTUDO_PASS:-}
    volumes:
      - app_data:/app/data
    command: ["rq", "worker", "cotacoes", "--url", "redis://redis:6379/0", "--max-jobs", "1"]
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[r]q worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
