services:
  redis:
    image: redis:7-alpine
    container_name: logtudo-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/cotacoes}
    container_name: logtudo-app
    ipc: host
    security_opt:
      - seccomp=./Conectividade/seccomp-playwright.json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - APP_HOST=${APP_HOST:-logtudo.com.br}
      - BASE_PATH=${BASE_PATH:-/cotacoes}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=cotacoes
      - RQ_JOB_TIMEOUT_SECONDS=7200
      - RQ_RESULT_TTL_SECONDS=86400
      - OBS_DB_PATH=${OBS_DB_PATH:-/app/data/observabilidade.sqlite3}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-}
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.logtudo-cotacoes-exact.rule=Host(`${APP_HOST:-logtudo.com.br}`) && Path(`${BASE_PATH:-/cotacoes}`)"
      - traefik.http.routers.logtudo-cotacoes-exact.priority=300
      - traefik.http.routers.logtudo-cotacoes-exact.entrypoints=http,https
      - traefik.http.routers.logtudo-cotacoes-exact.middlewares=logtudo-cotacoes-slash
      - traefik.http.routers.logtudo-cotacoes-exact.service=logtudo-cotacoes
      - "traefik.http.routers.logtudo-cotacoes.rule=Host(`${APP_HOST:-logtudo.com.br}`) && PathPrefix(`${BASE_PATH:-/cotacoes}/`)"
      - traefik.http.routers.logtudo-cotacoes.priority=200
      - traefik.http.routers.logtudo-cotacoes.entrypoints=http,https
      - traefik.http.routers.logtudo-cotacoes.middlewares=logtudo-cotacoes-strip
      - traefik.http.routers.logtudo-cotacoes.service=logtudo-cotacoes
      - "traefik.http.middlewares.logtudo-cotacoes-slash.redirectregex.regex=^https?://([^/]+)${BASE_PATH:-/cotacoes}$"
      - "traefik.http.middlewares.logtudo-cotacoes-slash.redirectregex.replacement=https://$${1}${BASE_PATH:-/cotacoes}/"
      - traefik.http.middlewares.logtudo-cotacoes-slash.redirectregex.permanent=true
      - "traefik.http.middlewares.logtudo-cotacoes-strip.stripprefix.prefixes=${BASE_PATH:-/cotacoes}"
      - traefik.http.services.logtudo-cotacoes.loadbalancer.server.port=8000
      - coolify.managed=true
      - coolify.proxy=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "automacao.api:app", "--host", "0.0.0.0", "--port", "8000"]

  rq-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/cotacoes}
    container_name: logtudo-rq-worker
    ipc: host
    security_opt:
      - seccomp=./Conectividade/seccomp-playwright.json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - APP_HOST=${APP_HOST:-logtudo.com.br}
      - BASE_PATH=${BASE_PATH:-/cotacoes}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=cotacoes
      - RQ_JOB_TIMEOUT_SECONDS=7200
      - RQ_RESULT_TTL_SECONDS=86400
      - OBS_DB_PATH=${OBS_DB_PATH:-/app/data/observabilidade.sqlite3}
      - LOGTUDO_USER=${LOGTUDO_USER:-ATUALIZARBI}
      - LOGTUDO_PASS=${LOGTUDO_PASS:-}
    volumes:
      - app_data:/app/data
    command: ["rq", "worker", "cotacoes", "--url", "redis://redis:6379/0", "--max-jobs", "1"]
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[r]q worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
